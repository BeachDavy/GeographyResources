<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Dodge</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: 'Courier New', monospace; }
        canvas { border: 1px solid #333; background: #001122; }
        #info { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); color: #0f0; font-size: 14px; z-index: 10; }
        #start-screen { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center; color: #0f0; z-index: 20; }
        #start-screen h1 { font-size: 32px; margin-bottom: 10px; }
        #start-screen p { font-size: 14px; color: #888; margin-bottom: 20px; }
        #start-screen button { background: #0f0; color: #000; border: none; padding: 12px 30px; font-size: 16px; cursor: pointer; font-family: inherit; }
        #start-screen button:hover { background: #0c0; }
    </style>
</head>
<body>
    <div id="info">Score: 0</div>
    <canvas id="game" width="800" height="600"></canvas>
    <div id="start-screen">
        <h1>Space Dodge</h1>
        <p>Use Arrow Keys or A/D to move.<br>Dodge the asteroids!</p>
        <button onclick="startGame()">Start</button>
    </div>
    <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const infoEl = document.getElementById('info');
    const startScreen = document.getElementById('start-screen');

    let player, asteroids, score, gameLoop, keys = {};
    let running = false;

    function reset() {
        player = { x: 400, y: 550, w: 30, h: 30, speed: 6 };
        asteroids = [];
        score = 0;
    }

    function startGame() {
        startScreen.style.display = 'none';
        reset();
        running = true;
        gameLoop = setInterval(update, 1000 / 60);
    }

    function spawnAsteroid() {
        const size = 15 + Math.random() * 35;
        asteroids.push({
            x: Math.random() * (canvas.width - size),
            y: -size,
            w: size, h: size,
            speed: 2 + Math.random() * 4 + score * 0.01,
            rot: 0,
            rotSpeed: (Math.random() - 0.5) * 0.1
        });
    }

    function update() {
        ctx.fillStyle = '#001122';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Stars
        ctx.fillStyle = '#223344';
        for (let i = 0; i < 50; i++) {
            const sx = (i * 137 + Date.now() * 0.02) % canvas.width;
            const sy = (i * 97 + Date.now() * 0.05) % canvas.height;
            ctx.fillRect(sx, sy, 2, 2);
        }

        // Move player
        if (keys['ArrowLeft'] || keys['a'] || keys['A']) player.x -= player.speed;
        if (keys['ArrowRight'] || keys['d'] || keys['D']) player.x += player.speed;
        player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));

        // Draw player (triangle ship)
        ctx.fillStyle = '#0f0';
        ctx.beginPath();
        ctx.moveTo(player.x + player.w / 2, player.y);
        ctx.lineTo(player.x, player.y + player.h);
        ctx.lineTo(player.x + player.w, player.y + player.h);
        ctx.closePath();
        ctx.fill();

        // Spawn asteroids
        if (Math.random() < 0.03 + score * 0.0002) spawnAsteroid();

        // Update asteroids
        for (let i = asteroids.length - 1; i >= 0; i--) {
            const a = asteroids[i];
            a.y += a.speed;
            a.rot += a.rotSpeed;

            ctx.save();
            ctx.translate(a.x + a.w / 2, a.y + a.h / 2);
            ctx.rotate(a.rot);
            ctx.fillStyle = '#888';
            ctx.beginPath();
            for (let j = 0; j < 6; j++) {
                const angle = (j / 6) * Math.PI * 2;
                const r = a.w / 2 * (0.8 + Math.sin(j * 3) * 0.2);
                const px = Math.cos(angle) * r;
                const py = Math.sin(angle) * r;
                if (j === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
            ctx.restore();

            // Collision
            if (a.x < player.x + player.w && a.x + a.w > player.x &&
                a.y < player.y + player.h && a.y + a.h > player.y) {
                clearInterval(gameLoop);
                running = false;
                startScreen.innerHTML = '<h1>Game Over</h1><p>Score: ' + score + '</p><button onclick="startGame()">Retry</button>';
                startScreen.style.display = 'block';
                return;
            }

            if (a.y > canvas.height) {
                asteroids.splice(i, 1);
                score += 10;
                infoEl.textContent = 'Score: ' + score;
            }
        }
    }

    document.addEventListener('keydown', e => { keys[e.key] = true; });
    document.addEventListener('keyup', e => { keys[e.key] = false; });
    </script>
</body>
</html>

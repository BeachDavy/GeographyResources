<!DOCTYPE html>
<html>
<head>
    <title>Play Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="play-body">

    <!-- HEADER -->
    <div class="play-header">
        <a class="back-btn" href="index.html">← Back</a>
        <span id="game-title">Loading...</span>
    </div>

    <!-- GAME FRAME -->
    <div class="play-main">
        <div class="play-frame-wrap">
            <iframe id="game-frame"></iframe>
        </div>
    </div>

<script>
    // Get game ID from URL
    const params = new URLSearchParams(window.location.search);
    const gameID = params.get("game");

    // Map g# → folder name
    const gameMap = {
        "g1": "1v1space",
        "g2": "100ng",
        "g3": "adrenalinechallenge",
        "g4": "among-us",
        "g5": "awesometanks2",
        "g6": "cookie-clicker",
        "g7": "crossyroad",
        "g8": "cubefield",
        "g9": "death-run-3d",
        "g10": "DogeMiner",
        "g11": "geodash",
        "g12": "minecraft-classic",
        "g13": "paperio2",
        "g14": "plants-vs-zombies-1",
        "g15": "precision-client",
        "g16": "retro-bowl",
        "g17": "run-3",
        "g18": "runner",
        "g19": "sandboxels",
        "g20": "slitherio",
        "g21": "slope",
        "g22": "snowbattle",
        "g23": "soccer-skills",
        "g24": "stickwar",
        "g25": "subway-surfers-ny",
        "g26": "thebattle"
    };

    // Set title
    document.getElementById("game-title").innerText =
        gameID ? gameMap[gameID] : "Unknown Game";

    // Load iframe
    if (gameID && gameMap[gameID]) {
        document.getElementById("game-frame").src =
            `games/${gameMap[gameID]}/index.html`;
    } else {
        document.getElementById("game-frame").src = "";
    }
</script>

</body>
</html>

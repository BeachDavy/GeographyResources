<!DOCTYPE html>
<html>
<head>
    <title>Play Game</title>
    <link rel="stylesheet" href="style.css">

    <!-- ADSENSE SCRIPT -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7243495410782424"
         crossorigin="anonymous"></script>
</head>

<body class="play-body">

    <!-- HEADER -->
    <div class="play-header">
        <a class="back-btn" href="index.html">← Back</a>
        <span id="game-title">Loading...</span>
    </div>

    <!-- AD ABOVE GAME (play-top-ad) -->
    <ins class="adsbygoogle"
         style="display:block;margin:20px 0"
         data-ad-client="ca-pub-7243495410782424"
         data-ad-slot="2456894445"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>
         (adsbygoogle = window.adsbygoogle || []).push({});
    </script>

    <!-- GAME FRAME -->
    <div class="play-main">
        <div class="play-frame-wrap">
            <iframe id="game-frame"></iframe>
        </div>
    </div>

    <!-- AD BELOW GAME (play-bottom-ad) -->
    <ins class="adsbygoogle"
         style="display:block;margin:20px 0"
         data-ad-client="ca-pub-7243495410782424"
         data-ad-slot="4013693707"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>
         (adsbygoogle = window.adsbygoogle || []).push({});
    </script>

<script>
    // Get game ID from URL
    const params = new URLSearchParams(window.location.search);
    const gameID = params.get("game");

    // Map g# → display name
    const gameMap = {
        "g1": "1v1space",
        "g2": "100ng",
        "g3": "adrenalinechallenge",
        "g4": "among-us",
        "g5": "awesometanks2",
        "g6": "cookie-clicker",
        "g7": "crossyroad",
        "g8": "cubefield",
        "g9": "death-run-3d",
        "g10": "DogeMiner",
        "g11": "geodash",
        "g12": "minecraft-classic",
        "g13": "paperio2",
        "g14": "plants-vs-zombies-1",
        "g15": "precision-client",
        "g16": "retro-bowl",
        "g17": "run-3",
        "g18": "runner",
        "g19": "sandboxels",
        "g20": "slitherio",
        "g21": "slope",
        "g22": "snowbattle",
        "g23": "soccer-skills",
        "g24": "stickwar",
        "g25": "subway-surfers-ny",
        "g26": "thebattle"
    };

    // Set title
    document.getElementById("game-title").innerText =
        gameID ? gameMap[gameID] : "Unknown Game";

    // Load iframe
    if (gameID) {
        document.getElementById("game-frame").src =
            `${gameID}/index.html`;
    } else {
        document.getElementById("game-frame").src = "";
    }
</script>

</body>
</html>
